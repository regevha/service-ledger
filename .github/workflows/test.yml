name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # The shuffled-order run (random test order, to catch tests that only pass
  # because of what ran before them) happens once a day, not on every push or
  # pull request: it costs a full extra run and a failure is about test
  # isolation, not about the change that happens to be under review. Scheduled
  # workflows run on the default branch. "Run workflow" in the Actions tab
  # starts the same shuffled run on demand.
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, about 06:17 in Israel
  workflow_dispatch:

# Both the backend's conftest.py and the frontend's playwright.config.ts
# hardcode this role/password (not just the dev-env default in
# backend/.env.example) and connect to it as localhost:5432, so this value
# has to match them exactly rather than being picked freely here.
env:
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: service_ledger
  PGPASSWORD: service_ledger_dev

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_ledger
          POSTGRES_PASSWORD: service_ledger_dev
          POSTGRES_DB: service_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Create service_ledger_test database
        run: psql -d service_ledger -c "CREATE DATABASE service_ledger_test;"

      - name: Apply migrations (sanity check against the primary database)
        env:
          DATABASE_URL: postgresql+psycopg2://service_ledger:service_ledger_dev@localhost:5432/service_ledger
        run: alembic upgrade head

      - name: Run pytest with coverage
        # tests/conftest.py defaults DATABASE_URL to service_ledger_test itself
        # and forces USE_LIVE_CLAUDE=false, so no env/secrets are needed here.
        # --cov reads backend/.coveragerc, whose fail_under floor (95%, branch
        # coverage included) makes this step fail when coverage drops — raise
        # the floor there when coverage improves. Missing lines are printed in
        # the log.
        #
        # Pushes and pull requests run in the fixed file order (-p no:randomly,
        # pytest-randomly is installed with the other requirements). The daily
        # scheduled run (and a manual "Run workflow") shuffles the order with
        # pytest-randomly; the seed is chosen here so it is printed in the log
        # and in the run summary. To replay a failing order locally:
        # pytest -p randomly --randomly-seed=<seed>
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SEED=$(( (RANDOM << 15) | RANDOM ))
            echo "pytest-randomly seed: $SEED" | tee -a "$GITHUB_STEP_SUMMARY"
            pytest -q --cov -p randomly --randomly-seed=$SEED
          else
            pytest -q --cov -p no:randomly
          fi

  frontend:
    name: Frontend (Playwright e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_ledger
          POSTGRES_PASSWORD: service_ledger_dev
          POSTGRES_DB: service_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        # playwright.config.ts's webServer entries boot the real FastAPI app
        # and app.worker directly via `python3`/`uvicorn`, so they need these
        # importable on PATH — no venv required in this isolated runner.
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create service_ledger_e2e database
        # Owned by this role by construction (it's also the role that creates
        # it) — matches the one-time manual `createdb` step in README.md.
        run: psql -d service_ledger -c "CREATE DATABASE service_ledger_e2e;"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's Chromium
        # playwright.config.ts only pins the sandbox's own pre-installed
        # Chromium when that exact path exists (see its SANDBOX_CHROMIUM
        # comment); anywhere else, including here, it falls back to
        # Playwright's own browser cache, which this installs.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e suite with coverage
        # test:e2e:coverage runs the same suite against an Istanbul-instrumented
        # build and ends with `nyc report --check-coverage`, so this step fails
        # when line coverage drops below 88% or branch coverage below 70% (the
        # thresholds live in frontend/package.json — raise them as coverage
        # improves). The table is printed in the log.
        working-directory: frontend
        #
        # Pushes and pull requests run the specs in the fixed order. The daily
        # scheduled run (and a manual "Run workflow") runs the spec files in a
        # random order (scripts/run-e2e-shuffled.mjs), to catch specs that only
        # pass because of the order they ran in. The seed and the order are
        # printed at the top of the step; to replay locally:
        # E2E_SHUFFLE_SEED=<seed> npm run test:e2e:shuffled
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            npm run test:e2e:coverage:shuffled
          else
            npm run test:e2e:coverage
          fi

      - name: Upload traces/screenshots on failure
        # playwright.config.ts writes an HTML report to playwright-report/ and
        # retain-on-failure traces and only-on-failure screenshots to
        # test-results/ (the report links to both). Open the report with
        # `npx playwright show-report <unzipped folder>`.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  built:
    name: Built page behind the password (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The production build of the page, served by the backend behind the shared password
    # (frontend/playwright.built.config.ts). Runs on every push and pull request. The post-deploy
    # smoke check (deploy/smoke.sh) does not run here: it needs a deployed address.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_ledger
          POSTGRES_PASSWORD: service_ledger_dev
          POSTGRES_DB: service_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create service_ledger_e2e database
        run: psql -d service_ledger -c "CREATE DATABASE service_ledger_e2e;"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the built-page suite
        # The config builds the page itself (an empty API base, into a temp folder), so there is no
        # separate build step.
        working-directory: frontend
        run: npm run test:e2e:built

      - name: Upload report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-built-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
