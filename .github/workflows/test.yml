name: Tests

on:
  push:
    branches: [main]
  pull_request:
  # The shuffled-order run (random test order, to catch tests that only pass
  # because of what ran before them) happens once a day, not on every push or
  # pull request: it costs a full extra run and a failure is about test
  # isolation, not about the change that happens to be under review. Scheduled
  # workflows run on the default branch. "Run workflow" in the Actions tab
  # starts the same shuffled run on demand.
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC, about 06:17 in Israel
  workflow_dispatch:

# A newer push to the same pull request cancels the older, now pointless run (a full run
# is about 37 billed minutes). Runs on main and the scheduled run are never cancelled.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both the backend's conftest.py and the frontend's playwright.config.ts
# hardcode this role/password (not just the dev-env default in
# backend/.env.example) and connect to it as localhost:5432, so this value
# has to match them exactly rather than being picked freely here.
env:
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: service_ledger
  PGPASSWORD: service_ledger_dev

jobs:
  # Cheap checks that fail in a minute or two, before the long suites finish: lint, types,
  # and two kinds of drift (the API's schema against the committed frontend types, and the
  # models against the migrations).
  static-checks:
    name: Static checks (lint, types, drift)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_ledger
          POSTGRES_PASSWORD: service_ledger_dev
          POSTGRES_DB: service_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies and Ruff
        working-directory: backend
        run: pip install -r requirements.txt ruff==0.17.4

      - name: Ruff (backend lint)
        working-directory: backend
        run: ruff check .

      - name: Models match the migrations
        # Fails when a model changed without a migration (alembic finds operations to generate).
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://service_ledger:service_ledger_dev@localhost:5432/service_ledger
        run: |
          alembic upgrade head
          alembic check

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Oxlint (frontend lint)
        working-directory: frontend
        run: npx oxlint

      - name: TypeScript type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Vitest (frontend unit tests)
        working-directory: frontend
        run: npm test

      - name: Frontend API types match the backend
        # frontend/src/generated/api-schema.ts is committed; this regenerates it from the
        # backend's OpenAPI schema and fails if the committed file is out of date.
        # Fix: cd frontend && npm run codegen (see frontend/README.md).
        run: |
          (cd backend && python -m scripts.export_openapi > ../frontend/openapi.json)
          (cd frontend && npm run codegen && git diff --exit-code -- src/generated/api-schema.ts)

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_ledger
          POSTGRES_PASSWORD: service_ledger_dev
          POSTGRES_DB: service_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Create service_ledger_test database
        run: psql -d service_ledger -c "CREATE DATABASE service_ledger_test;"

      - name: Apply migrations (sanity check against the primary database)
        env:
          DATABASE_URL: postgresql+psycopg2://service_ledger:service_ledger_dev@localhost:5432/service_ledger
        run: alembic upgrade head

      - name: Run pytest with coverage
        # tests/conftest.py defaults DATABASE_URL to service_ledger_test itself
        # and forces USE_LIVE_CLAUDE=false, so no env/secrets are needed here.
        # --cov reads backend/.coveragerc, whose fail_under floor (95%, branch
        # coverage included) makes this step fail when coverage drops — raise
        # the floor there when coverage improves. Missing lines are printed in
        # the log.
        #
        # Pushes and pull requests run in the fixed file order (-p no:randomly,
        # pytest-randomly is installed with the other requirements). The daily
        # scheduled run (and a manual "Run workflow") shuffles the order with
        # pytest-randomly; the seed is chosen here so it is printed in the log
        # and in the run summary. To replay a failing order locally:
        # pytest -p randomly --randomly-seed=<seed>
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SEED=$(( (RANDOM << 15) | RANDOM ))
            echo "pytest-randomly seed: $SEED" | tee -a "$GITHUB_STEP_SUMMARY"
            pytest -q --cov -p randomly --randomly-seed=$SEED
          else
            pytest -q --cov -p no:randomly
          fi

  # The e2e suite runs as three shards (`playwright test --shard=N/3`), each in its own job with its own
  # Postgres service: the specs share one database with no reset between them, so shards cannot
  # share one. Each shard writes its Istanbul coverage files and uploads them; the job after the shards
  # (named "Frontend (Playwright e2e)" as before) merges all the sets and applies the coverage thresholds
  # once, on the whole suite, as the single run used to. Add a shard (matrix, the name and `/3` below) when a
  # shard's run nears 15 minutes.
  frontend-shards:
    name: Playwright e2e shard ${{ matrix.shard }} of 3
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      # Let the other shard finish when one fails, so a run shows every failing spec at once.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_ledger
          POSTGRES_PASSWORD: service_ledger_dev
          POSTGRES_DB: service_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        # playwright.config.ts's webServer entries boot the real FastAPI app
        # and app.worker directly via `python3`/`uvicorn`, so they need these
        # importable on PATH — no venv required in this isolated runner.
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create service_ledger_e2e database
        # Owned by this role by construction (it's also the role that creates
        # it) — matches the one-time manual `createdb` step in README.md.
        run: psql -d service_ledger -c "CREATE DATABASE service_ledger_e2e;"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's Chromium
        # playwright.config.ts only pins the sandbox's own pre-installed
        # Chromium when that exact path exists (see its SANDBOX_CHROMIUM
        # comment); anywhere else, including here, it falls back to
        # Playwright's own browser cache, which this installs.
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run this shard's specs with coverage
        # COVERAGE=1 runs the suite against an Istanbul-instrumented build; the files land in
        # frontend/.nyc_output and the next step uploads them. The thresholds are checked after
        # the shards, by the "Frontend (Playwright e2e)" job, on all the shards together.
        working-directory: frontend
        env:
          SHARD: ${{ matrix.shard }}/3
        #
        # Pushes and pull requests run the specs in the fixed order. The daily
        # scheduled run (and a manual "Run workflow") runs the spec files in a
        # random order (scripts/run-e2e-shuffled.mjs), to catch specs that only
        # pass because of the order they ran in. All shards must shuffle the
        # same way, or they would split two different orders between them and
        # skip or repeat specs, so the seed is the run's id, not a random number.
        # It is printed at the top of the step. To replay the whole order locally
        # (no --shard): E2E_SHUFFLE_SEED=<seed> npm run test:e2e:shuffled
        run: |
          rm -rf .nyc_output coverage
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COVERAGE=1 E2E_SHUFFLE_SEED="${{ github.run_id }}" node scripts/run-e2e-shuffled.mjs --shard="$SHARD"
          else
            COVERAGE=1 npx playwright test --shard="$SHARD"
          fi

      - name: Keep this shard's coverage files
        # .nyc_output starts with a dot: upload-artifact skips such folders unless told not to.
        uses: actions/upload-artifact@v7
        with:
          name: nyc-output-${{ matrix.shard }}
          path: frontend/.nyc_output
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload traces/screenshots on failure
        # playwright.config.ts writes an HTML report to playwright-report/ and
        # retain-on-failure traces and only-on-failure screenshots to
        # test-results/ (the report links to both). Open the report with
        # `npx playwright show-report <unzipped folder>`.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-shard-${{ matrix.shard }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  frontend:
    # Keeps the name this check always had. It passes when every shard passed and the coverage of
    # all of them together meets the thresholds.
    name: Frontend (Playwright e2e)
    needs: frontend-shards
    # Runs even when a shard failed, so the check reports that instead of staying "skipped".
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: All shards must have passed
        if: needs.frontend-shards.result != 'success'
        run: |
          echo "The e2e shards finished as: ${{ needs.frontend-shards.result }}. See the shard jobs above."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Collect every shard's coverage files
        uses: actions/download-artifact@v8
        with:
          pattern: nyc-output-*
          merge-multiple: true
          path: frontend/.nyc_output

      - name: Check coverage of the whole suite
        # `nyc report --check-coverage` fails when line coverage is below 88% or branch coverage
        # below 75% (the thresholds live in frontend/package.json under coverage:report — raise
        # them as coverage improves). It merges the files of all the shards; the table is printed
        # in the log. The source paths in the files are the runner's own checkout path, the same
        # here as in the shard jobs.
        working-directory: frontend
        run: npm run coverage:report

  built:
    name: Built page behind the password (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The production build of the page, served by the backend behind the shared password
    # (frontend/playwright.built.config.ts). Runs on every push and pull request. The post-deploy
    # smoke check (deploy/smoke.sh) does not run here: it needs a deployed address.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_ledger
          POSTGRES_PASSWORD: service_ledger_dev
          POSTGRES_DB: service_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create service_ledger_e2e database
        run: psql -d service_ledger -c "CREATE DATABASE service_ledger_e2e;"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run the built-page suite
        # The config builds the page itself (an empty API base, into a temp folder), so there is no
        # separate build step.
        working-directory: frontend
        run: npm run test:e2e:built

      - name: Upload report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-built-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  webkit:
    name: Phone tests in WebKit (Playwright, nightly)
    # Only on the daily schedule and on "Run workflow": it needs its own browser download and
    # WebKit's rendering is not what a change under review is likely to break.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_ledger
          POSTGRES_PASSWORD: service_ledger_dev
          POSTGRES_DB: service_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Create service_ledger_e2e database
        run: psql -d service_ledger -c "CREATE DATABASE service_ledger_e2e;"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright's WebKit
        working-directory: frontend
        # The Ubuntu package mirror on the runner is sometimes very slow (minutes per small package), which
        # used to hold this step until the whole job timed out. Each attempt is capped and tried again. A
        # capped attempt leaves its apt-get running (it holds the package lock), so that is stopped before
        # the next attempt; packages already downloaded are kept, so a retry carries on where it stopped.
        run: |
          for attempt in 1 2 3; do
            timeout 6m npx playwright install --with-deps webkit && exit 0
            echo "Install attempt $attempt did not finish; trying again."
            sudo pkill -x apt-get || true
            sudo pkill -x dpkg || true
            sleep 3
            sudo dpkg --configure -a || true
          done
          exit 1

      - name: Run the phone tests in WebKit
        working-directory: frontend
        env:
          E2E_WEBKIT: "1"
        run: npx playwright test --project=phone-webkit

      - name: Upload report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-results
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
