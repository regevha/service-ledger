name: image-check

# Builds the backend image and checks its HEALTHCHECK (SL-10): the API container must reach
# "healthy", and a worker container from the same image must never be "unhealthy". Runs only when
# the image or this check changes, and on demand from the Actions tab.
on:
  pull_request:
    paths:
      - backend/Dockerfile
      - backend/requirements.txt
      - .github/workflows/image-check.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  healthcheck:
    name: API container is healthy, worker container is not unhealthy
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: service_ledger
          POSTGRES_PASSWORD: service_ledger_dev
          POSTGRES_DB: service_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://service_ledger:service_ledger_dev@localhost:5432/service_ledger

    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the image
        # The image copies frontend/dist; the health check does not need the real page, so a
        # placeholder stands in and the check stays fast.
        run: |
          mkdir -p frontend/dist
          echo '<!doctype html><title>placeholder</title>' > frontend/dist/index.html
          docker build -f backend/Dockerfile -t service-ledger:check .

      - name: Migrate the database
        run: docker run --rm --network host -e DATABASE_URL service-ledger:check alembic upgrade head

      - name: Start the API and the worker
        run: |
          docker run -d --name api --network host -e DATABASE_URL service-ledger:check
          docker run -d --name worker --network host -e DATABASE_URL service-ledger:check python -m app.worker

      - name: The API becomes healthy; the worker never reports unhealthy
        # start-period 20s, interval 30s, retries 3: healthy is expected within about a minute.
        run: |
          for i in $(seq 1 36); do
            api=$(docker inspect -f '{{.State.Health.Status}}' api)
            if [ "$(docker inspect -f '{{.State.Status}}' api)" != "running" ]; then
              echo "::error::The API container stopped."; docker logs api; exit 1
            fi
            worker=$(docker inspect -f '{{.State.Status}} {{.State.Health.Status}}' worker)
            echo "after $((i * 5))s: api=$api worker=$worker"
            if [ "$worker" != "running starting" ] && [ "$worker" != "running healthy" ]; then
              echo "::error::The worker container is '$worker'."; docker logs worker; exit 1
            fi
            if [ "$api" = "unhealthy" ]; then
              echo "::error::The API container is unhealthy."; docker logs api; exit 1
            fi
            if [ "$api" = "healthy" ] && [ "$worker" = "running healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::Timed out waiting for both containers to report healthy."
          docker logs api; docker logs worker; exit 1
