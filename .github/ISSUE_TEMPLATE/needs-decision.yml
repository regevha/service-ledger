name: Needs decision
description: A question only the user can answer (raised by product-manager or the lead).
labels: ["needs-decision"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and recommendation
      description: Each option with its cost, and which one is recommended.
    validations:
      required: true
  - type: textarea
    id: blocks
    attributes:
      label: What this blocks
