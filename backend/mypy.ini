# Type check for the backend (the frontend's counterpart is `tsc -b`).
# Run from backend/:  mypy app   (the CI step counts the errors; see "Type checking" in README.md)
# Not strict: it reports what the code already says. The count may not rise (mypy-baseline.txt).
[mypy]
# The version CI runs (.github/workflows/test.yml). Keep comments on their own line:
# mypy reads an inline comment as part of the value.
python_version = 3.11
ignore_missing_imports = False
