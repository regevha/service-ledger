# Type checking for the backend. Run from backend/:  mypy app
# Not clean yet: CI compares the error count with mypy-baseline.txt and fails only when
# it goes UP. When you fix errors, lower the number in mypy-baseline.txt in the same pull request.
[mypy]
python_version = 3.11
ignore_missing_imports = True
check_untyped_defs = False
