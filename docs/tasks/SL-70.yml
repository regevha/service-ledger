# Why: the first real re-read of 9 reports (2026-11-14) gave 67.5% kept, but 89% on structured fields and
# 1 of 9 on the work_performed narrative, where an exact match counts every rewording as a miss.
# User decisions (2026-11-14): split structured and free-text fields; compare free text loosely; show the
# differences on the accuracy page, not in a terminal; save the re-read as the first reading, marked.
# Free-text fields are named in one constant (work_performed, fault_description, root_cause,
# service_description), not guessed from the field type. Loose = ignoring case, spacing and punctuation,
# and nothing else; every other field keeps the exact rule. One compare function serves the page, the Home
# tile and the script, so the figures stay equal. No migration: the marker is `params.baseline = "reread"`
# on an extract job row added for the report. Never overwrite an existing first reading. No names, values
# or file names in any output or log line (public repository).
