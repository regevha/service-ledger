acceptance: [SL-114]
# Why: proposal "HTML reports and rejecting non-report files at intake", pull request 2 of 4.
#
# Change: at upload an image below MIN_IMAGE_LONG_SIDE x MIN_IMAGE_SHORT_SIDE (default 600 x 300), or above
# MAX_IMAGE_PIXELS_TOTAL (100 million), is refused with a plain 422 message, before anything is stored or read.
# When an image is sent to the model, one whose long side exceeds MAX_IMAGE_LONG_SIDE (2000) is shrunk, keeping its
# proportions (JPEG stays JPEG, other types become PNG); the stored original is untouched. Header-only checks via
# Pillow; a file Pillow cannot open is not judged. All limits are settings, validated at startup.
# The existing upload byte caps are unchanged (images 5 MB, PDFs 20 MB).
#
# Acceptance (testable):
#   1. tests/test_image_size.py passes: boundaries (600 x 300, 599 x 300, 600 x 299, portrait), refusal leaves
#      nothing on disk, pixel ceiling, JPEG/GIF/PNG shrink with proportions, unchanged when within size, original kept.
#   2. e2e error-states.spec.ts: a 1 x 1 image is refused with its size; an 800 x 600 image is accepted.
#   3. Full backend suite green; ruff clean; mypy not above baseline (75).
