# Why: test review item 1.3 (finding C-02). The suites run in parallel with the static checks, so a
# change that fails lint or types still occupies 6 shards, the backend and the built-page job for
# about 8 minutes of wall-clock time (about 45 billed minutes; measured on six recent runs of the
# current workflow: 44 to 50) before the run is over.
#
# Change: a last step in static-checks, `if: failure() && pull_request`, runs `gh run cancel` on the
# run (job permissions: contents read, actions write). Pushes to main and the scheduled run are not
# cancelled. A read-only token (fork or Dependabot PR) only warns.
#
# Acceptance (testable):
#   1. A pull request with a deliberate lint failure: the shards are cancelled within about a minute
#      of the static check failing.
#   2. A pull request with no failing static check: nothing is cancelled and the run finishes as before.
#   3. What a cancelled run looks like for the "ci-ok" check (it must not read as passing) is recorded.
# Observed on throwaway PR #386 (lint failure on top of SL-116 and this task): Ruff failed at 07:31:09;
# every other job had stopped by 07:31:22; the run ended "cancelled"; static-checks ended "cancelled"
# (its Ruff step is marked failure); ci-ok ended "failure" with the jobs listed. A lint failure now reads
# "Cancelled" on the checks list, not a red cross: say so in the PR.
# Depends on SL-116 only for merge order (both edit test.yml, one at a time).
