# Why: at 390 px the reading-accuracy corrections table was clipped on the right (Approved column unreachable).
# Cause: the phone rule gave .admin-screen a single "1fr" column, whose minimum is the widest content, so the
# admin area grew to 492 px inside a 390 px screen. Fix: minmax(0, 1fr), so wide tables scroll inside their own wrapper.
