# Why: proposal "HTML reports and rejecting non-report files at intake", pull request 4 of 4. The review
# screen shows page images with the fields drawn on them; an HTML report had only its extracted text.
#
# Change: the first time pages, words, field positions or the inline file of an HTML report are asked for, a PDF
# copy is rendered with headless Chromium (scripts off, every network request refused, rendered from a string)
# and kept beside the original as <name>.html.display.pdf. The original HTML stays the stored file, the download
# and the duplicate-detection source. Pages, words and field-locations then work as for a PDF. Without Chromium
# (or if a render fails) the text view from SL-112 is used, so nothing depends on it. Settings
# HTML_PDF_CHROMIUM_PATH and HTML_PDF_TIMEOUT_SECONDS. The image installs Chromium and Hebrew-capable fonts.
#
# Acceptance (testable):
#   1. backend/tests/test_html_pdf_copy.py passes with Chromium; the fallback test passes without it.
#   2. e2e html-reports.spec.ts: the review/confirm screen draws the HTML report as page images.
#   3. ruff clean; mypy count not above baseline; full backend suite green.
# Not verified here: the Docker image build (no Docker in the cloud workspace).
